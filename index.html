<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/hvv-tw/vt-clan/main/vy.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN CLAN × TY CLAN | rivals戰對</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #020204;
            color: #fff;
            perspective: 1200px;
        }

        body {
            cursor: none;
            position: relative;
        }
        a, .split, .btn, .hud-toggle {
            cursor: none !important;
        }

        #custom-cursor {
            width: 8px;
            height: 8px;
            background: #ff7300;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff7300, 0 0 20px #ffaa00;
            will-change: transform;
            transition: background 0.3s, box-shadow 0.3s;
        }

        #custom-cursor-blur {
            width: 32px;
            height: 32px;
            border: 1.5px solid rgba(255, 115, 0, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1), width 0.2s, height 0.2s, border-color 0.3s, background 0.3s;
            background: rgba(255, 115, 0, 0.03);
            will-change: transform;
        }

        body.cursor-clicking #custom-cursor {
            transform: translate(-50%, -50%) scale(0.7);
        }
        body.cursor-clicking #custom-cursor-blur {
            transform: translate(-50%, -50%) scale(1.6);
        }

        body:has(.vn-side:hover) #custom-cursor {
            background: #00f2fe;
            box-shadow: 0 0 10px #00f2fe, 0 0 20px #4facfe;
        }
        body:has(.vn-side:hover) #custom-cursor-blur {
            border-color: rgba(0, 242, 254, 0.6);
            background: rgba(0, 242, 254, 0.08);
        }
        body.cursor-clicking:has(.vn-side:hover) #custom-cursor-blur {
            background: rgba(0, 242, 254, 0.2);
        }

        body:has(.ty-side:hover) #custom-cursor {
            background: #ff3b30;
            box-shadow: 0 0 10px #ff3b30, 0 0 20px #ff453a;
        }
        body:has(.ty-side:hover) #custom-cursor-blur {
            border-color: rgba(255, 59, 48, 0.5);
            background: rgba(255, 59, 48, 0.06);
        }
        body.cursor-clicking:has(.ty-side:hover) #custom-cursor-blur {
            background: rgba(255, 59, 48, 0.15);
        }

        body:has(.middle-gap:hover) #custom-cursor {
            animation: rainbow-dot 1.5s linear infinite;
        }
        body:has(.middle-gap:hover) #custom-cursor-blur {
            animation: rainbow-blur 1.5s linear infinite;
            background: rgba(255, 255, 255, 0.03);
        }

        body:has(.hud-panel:hover) #custom-cursor {
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }
        body:has(.hud-panel:hover) #custom-cursor-blur {
            border-color: rgba(255, 255, 255, 0.3);
            background: transparent;
        }

        @keyframes rainbow-dot {
            0% { background: #ff0055; box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
            20% { background: #00f2fe; box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe; }
            40% { background: #00ff66; box-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66; }
            60% { background: #ffe259; box-shadow: 0 0 10px #ffe259, 0 0 20px #ffe259; }
            80% { background: #ff00ff; box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
            100% { background: #ff0055; box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        }
        @keyframes rainbow-blur {
            0% { border-color: rgba(255, 0, 85, 0.6); }
            20% { border-color: rgba(0, 242, 254, 0.6); }
            40% { border-color: rgba(0, 255, 102, 0.6); }
            60% { border-color: rgba(255, 226, 89, 0.6); }
            80% { border-color: rgba(255, 0, 255, 0.6); }
            100% { border-color: rgba(255, 0, 85, 0.6); }
        }

        .click-burst-p {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 10001;
            will-change: transform, opacity;
            animation: burstAnim 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstAnim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; }
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            will-change: transform;
        }

        .container.shake {
            animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }

        .container.terminal-glitch {
            animation: terminalDistort 0.12s linear infinite;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, -1px, 0); }
            20%, 80% { transform: translate3d(3px, 1px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, -2px, 0); }
            40%, 60% { transform: translate3d(5px, 2px, 0); }
        }

        @keyframes terminalDistort {
            0% { transform: skewX(0deg) scaleY(1); filter: hue-rotate(0deg) contrast(1); }
            20% { transform: skewX(2deg) scaleY(1.02); filter: hue-rotate(10deg) contrast(1.2); opacity: 0.9; }
            60% { transform: skewX(-2deg) scaleY(0.98); filter: clip-path(inset(10% 0 30% 0)); }
            80% { transform: skewX(0deg) scaleY(1); filter: hue-rotate(-10deg); }
            100% { transform: skewX(0deg) scaleY(1); filter: none; }
        }

        #impact-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
        }
        #impact-flash.flash-vn { animation: flashBlue 0.45s ease-out; }
        #impact-flash.flash-ty { animation: flashRed 0.45s ease-out; }

        @keyframes flashBlue {
            0% { opacity: 0.4; background: #00f2fe; filter: blur(15px); }
            100% { opacity: 0; background: transparent; }
        }
        @keyframes flashRed {
            0% { opacity: 0.35; background: #ff3b30; filter: blur(15px); }
            100% { opacity: 0; background: transparent; }
        }

        .split {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease, backdrop-filter 0.4s ease;
            overflow: hidden;
            z-index: 1;
            will-change: flex-grow, filter;
        }

        .split::before {
            content: '';
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            opacity: 0.06;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform, opacity;
            z-index: 1;
        }

        .particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .split::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 3;
            left: var(--x, 50%);
            top: var(--y, 50%);
            transform: translate(-50%, -50%);
            will-change: left, top, opacity;
        }

        .split:hover {
            flex-grow: 1.5;
        }
        
        .container:has(.split:hover) .split:not(:hover) {
            flex-grow: 0.7;
            filter: brightness(0.15) grayscale(0.9);
        }

        .vn-side {
            background: linear-gradient(135deg, #040612 0%, #010102 100%);
        }
        .vn-side::before {
            background-image: linear-gradient(rgba(0, 242, 254, 0.12) 1.5px, transparent 1.5px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.12) 1.5px, transparent 1.5px);
            background-size: 60px 60px;
        }
        .vn-side::after {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, transparent 70%);
        }
        .vn-side:hover::before {
            opacity: 0.22;
            transform: scale(1.05) translate(var(--bg-x, 0px), var(--bg-y, 0px));
        }
        .vn-side:hover::after {
            opacity: 1;
        }

        .ty-side {
            background: linear-gradient(135deg, #140505 0%, #020101 100%);
            transition: filter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ty-side::before {
            background: repeating-linear-gradient(45deg, rgba(255, 59, 48, 0.04), rgba(255, 59, 48, 0.04) 15px, transparent 15px, transparent 30px);
        }
        .ty-side::after {
            background: radial-gradient(circle, rgba(255, 59, 48, 0.18) 0%, transparent 70%);
        }
        .ty-side:hover {
            filter: grayscale(0.2) brightness(0.85);
        }
        .ty-side:hover::before {
            opacity: 0.15;
            transform: scale(1.05) rotate(1deg) translate(var(--bg-x, 0px), var(--bg-y, 0px));
        }
        .ty-side:hover::after {
            opacity: 1;
        }

        .ty-giant-x {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 65vh;
            color: #ff3b30;
            line-height: 1;
            z-index: 2;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 0 60px rgba(255, 59, 48, 0.75));
            opacity: 0.85;
        }

        .middle-gap {
            width: 85px;
            background: #050507;
            border-left: 1px solid rgba(0, 242, 254, 0.25);
            border-right: 1px solid rgba(255, 59, 48, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        .middle-gap::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, transparent, rgba(0, 242, 254, 0.2), rgba(255, 59, 48, 0.2), transparent);
            animation: scanline 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes scanline {
            0% { top: -100%; }
            100% { top: 200%; }
        }
        
        .coop-text {
            writing-mode: vertical-lr;
            text-orientation: upright;
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: 16px;
            background: linear-gradient(180deg, #00f2fe 0%, #ff3b30 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: pulseGlow 1.8s ease-in-out infinite alternate;
            will-change: transform, filter;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.5)) drop-shadow(0 0 8px rgba(255, 59, 48, 0.4)); transform: scale(0.97); }
            100% { filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.8)) drop-shadow(0 0 16px rgba(255, 59, 48, 0.7)); transform: scale(1.03); }
        }

        .container:has(.split:hover) .coop-text {
            filter: drop-shadow(0 0 25px #00f2fe);
            transform: scale(1.1) rotate(-3deg);
        }
        .container:has(.ty-side:hover) .coop-text {
            filter: drop-shadow(0 0 25px #ff3b30);
            transform: scale(1.1) rotate(3deg);
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 36px;
            padding: 55px 45px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s, box-shadow 0.4s;
            position: relative;
            z-index: 5;
            overflow: hidden;
            will-change: transform;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 36px;
            background: radial-gradient(circle at var(--gloss-x, 50%) var(--gloss-y, 50%), rgba(255, 255, 255, 0.08) 0%, transparent 55%);
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 12px;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
        }

        .border-glow-path {
            position: absolute;
            inset: 0;
            border-radius: 36px;
            pointer-events: none;
            z-index: 7;
            padding: 2px;
            background: transparent;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .vn-side:hover .border-glow-path {
            opacity: 1;
            background: conic-gradient(from var(--border-angle, 0deg), transparent 40%, #00f2fe 70%, #4facfe 100%);
            animation: borderRotate 2s linear infinite;
        }
        .ty-side:hover .border-glow-path {
            opacity: 1;
            background: conic-gradient(from var(--border-angle, 0deg), transparent 40%, #ff3b30 70%, #ff453a 100%);
            animation: borderRotate 2s linear infinite;
        }

        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes borderRotate {
            to { --border-angle: 360deg; }
        }

        .vn-side:hover .card::before {
            opacity: 1;
            background: radial-gradient(circle at var(--gloss-x, 50%) var(--gloss-y, 50%), rgba(0, 242, 254, 0.15) 0%, transparent 60%);
        }
        .ty-side:hover .card::before {
            opacity: 1;
            background: radial-gradient(circle at var(--gloss-x, 50%) var(--gloss-y, 50%), rgba(255, 59, 48, 0.15) 0%, transparent 60%);
        }

        .vn-side:hover .card::after {
            background: linear-gradient(to bottom, transparent, rgba(0, 242, 254, 0.25), transparent);
            animation: cardRadarScan 2.2s linear infinite;
        }
        .ty-side:hover .card::after {
            background: linear-gradient(to bottom, transparent, rgba(255, 59, 48, 0.25), transparent);
            animation: cardRadarScan 2.2s linear infinite;
        }

        @keyframes cardRadarScan {
            0% { top: -20%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 120%; opacity: 0; }
        }

        .card > * {
            transform: translateZ(30px);
        }

        .vn-side .card {
            border: 1px solid rgba(0, 242, 254, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }
        .vn-side:hover .card {
            border-color: transparent;
            box-shadow: 0 40px 80px rgba(0, 242, 254, 0.35), inset 0 0 30px rgba(0, 242, 254, 0.15);
        }

        .ty-side .card {
            border: 1px solid rgba(255, 59, 48, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(35px) brightness(0.6);
            -webkit-backdrop-filter: blur(35px) brightness(0.6);
            background: rgba(10, 2, 2, 0.2);
        }
        .ty-side:hover .card {
            box-shadow: 0 40px 80px rgba(255, 59, 48, 0.2), inset 0 0 40px rgba(255, 59, 48, 0.05);
        }

        .logo-text {
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
            transform: translateZ(60px) scale(1);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            white-space: nowrap;
        }
        .split:hover .logo-text {
            transform: translateZ(80px) scale(1.05);
        }
        
        .vn-side:hover .vn-text {
            animation: shineText 2.5s linear infinite, glitchText 0.3s linear;
        }
        .ty-side:hover .ty-text {
            animation: shineText 2.5s linear infinite, glitchTextRed 0.4s linear infinite alternate;
        }

        @keyframes glitchText {
            0% { transform: translateZ(80px) scale(1.05) skewX(0deg); text-shadow: 2px -1px 0 #ffe259, -2px 1px 0 #00f2fe; }
            20% { transform: translateZ(80px) scale(1.07) skewX(-3deg); text-shadow: -3px 2px 0 #ffe259, 3px -2px 0 #00f2fe; }
            40% { transform: translateZ(80px) scale(1.03) skewX(2deg); text-shadow: 1px -2px 0 #ffe259, -1px 2px 0 #00f2fe; }
            60% { transform: translateZ(80px) scale(1.05) skewX(-1deg); text-shadow: -1px 1px 0 #ffe259, 2px -1px 0 #00f2fe; }
            80% { transform: translateZ(80px) scale(1.04) skewX(0deg); text-shadow: 2px 1px 0 #ffe259, -2px -1px 0 #00f2fe; }
            100% { transform: translateZ(80px) scale(1.05) skewX(0deg); text-shadow: none; }
        }

        @keyframes glitchTextRed {
            0% { transform: translateZ(80px) scale(1.02) skewX(0deg); text-shadow: 1px -1px 0 #ffaa00, -1px 1px 0 #ff3b30; opacity: 0.8; }
            50% { transform: translateZ(80px) scale(1.01) skewX(1deg); text-shadow: -2px 1px 0 #ffaa00, 2px -1px 0 #ff3b30; opacity: 0.9; }
            100% { transform: translateZ(80px) scale(1.02) skewX(-1deg); text-shadow: 1px 1px 0 #ffaa00, -1px -1px 0 #ff3b30; opacity: 0.7; }
        }

        .vn-text {
            background: linear-gradient(45deg, #00f2fe, #4facfe, #00f2fe);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 2.5s linear infinite;
        }
        .ty-text {
            background: linear-gradient(45deg, #5c1e1a, #7a221c, #5c1e1a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.5;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .sub-title {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            transform: translateZ(40px);
        }
        
        .sub-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            width: 0;
            height: 2px;
            transform: translateX(-50%);
            transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .vn-side:hover .sub-title::after { width: 90%; background: #00f2fe; box-shadow: 0 0 8px #00f2fe; }

        .vn-side .sub-title { color: rgba(0, 242, 254, 0.85); text-shadow: 0 0 10px rgba(0,242,254,0.3); }
        .ty-side .sub-title { color: rgba(255, 59, 48, 0.25); text-shadow: none; }

        .desc {
            font-size: 1rem;
            line-height: 1.75;
            color: #b0b0b8;
            margin-bottom: 35px;
            transform: translateZ(35px);
            transition: color 0.3s ease;
        }
        .vn-side:hover .desc {
            color: #fff;
        }
        .ty-side .desc {
            color: #4a3836;
        }

        .difficulty-box {
            border-radius: 24px;
            padding: 15px 28px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 35px;
            display: inline-block;
            width: 100%;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
            transform: translateZ(45px);
        }

        .difficulty-box::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }
        .vn-side:hover .difficulty-box::before {
            left: 150%;
            transition: left 1s ease;
        }

        .vn-box {
            background: rgba(0, 242, 254, 0.01);
            border: 1px dashed rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            text-shadow: 0 0 8px rgba(0,242,254,0.3);
        }
        .vn-side:hover .vn-box {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(0, 242, 254, 0.15);
            transform: scale(1.03) translateZ(55px);
        }

        .ty-box {
            background: rgba(255, 59, 48, 0.005);
            border: 1px dashed rgba(255, 59, 48, 0.1);
            color: rgba(255, 69, 58, 0.3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 50px;
            width: 100%;
            letter-spacing: 3px;
            translate: var(--mag-x, 0px) var(--mag-y, 0px);
            transform: translateZ(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2), background 0.4s, color 0.4s, box-shadow 0.4s, border-color 0.4s;
            will-change: translate, transform;
        }

        .btn-vn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #010103;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }
        .btn-vn:hover {
            transform: translateY(-6px) scale(1.03) translateZ(75px);
            box-shadow: 0 20px 35px rgba(0, 242, 254, 0.55), 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .ty-malware-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transform: translateZ(70px);
            user-select: none;
            pointer-events: none;
            margin-top: 5px;
        }

        .ty-warning-text-huge {
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.6;
            color: #ff453a;
            text-shadow: 0 0 20px rgba(255, 69, 58, 0.95), 0 0 40px rgba(255, 69, 58, 0.5);
            animation: massiveTextGlow 1.2s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            text-align: center;
        }

        @keyframes massiveTextGlow {
            0% {
                transform: scale(0.98);
                opacity: 0.75;
                filter: drop-shadow(0 0 8px rgba(255, 69, 58, 0.5)) blur(0.4px);
            }
            100% {
                transform: scale(1.02);
                opacity: 1;
                filter: drop-shadow(0 0 30px rgba(255, 69, 58, 1)) blur(0px);
            }
        }

        .hud-panel {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(5, 5, 10, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 20px;
            z-index: 10005;
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-monitor {
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 105px;
        }

        .hud-value {
            color: #00f2fe;
            font-weight: bold;
        }

        .hud-toggle {
            background: transparent;
            border: 1px solid #ff7300;
            color: #ff7300;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 115, 0, 0.2);
        }

        .hud-toggle.audio-on {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <div id="custom-cursor-blur"></div>
    <div id="impact-flash"></div>

    <div class="hud-panel">
        <div class="hud-monitor">
            <div>SYS_STATUS: <span class="hud-value" style="color: #00ff66;">ONLINE</span></div>
            <div>FPS: <span id="fpsVal" class="hud-value">--</span></div>
            <div>PING: <span id="pingVal" class="hud-value">--</span> ms</div>
        </div>
        <button class="hud-toggle audio-on" id="audioToggle">AUDIO: ON</button>
    </div>

    <div class="container" id="mainContainer">
        
        <div class="split vn-side" id="vnSide">
            <canvas id="vnCanvas" class="particles-canvas"></canvas>
            <div class="card">
                <div class="border-glow-path"></div>
                <div class="logo-text vn-text">VN CLAN</div>
                <div class="sub-title">EST 2026</div>
                <p class="desc">
                    不錯的戰對。適合給喜歡有挑戰性的Rivals玩家。每個成員都品行優良。
                </p>
                <div class="difficulty-box vn-box">考核難度：比較難考</div>
                <a href="https://discord.gg/UNRVAcKmD3" target="_blank" class="btn btn-vn" id="vnBtn">
                    進入 DISCORD 伺服器
                </a>
            </div>
        </div>

        <div class="middle-gap" id="middleGap">
            <div class="coop-text">合作中</div>
        </div>

        <div class="split ty-side" id="tySide">
            <canvas id="tyCanvas" class="particles-canvas"></canvas>
            <div class="ty-giant-x">❌</div>
            <div class="card">
                <div class="border-glow-path"></div>
                <div class="logo-text ty-text">TY CLAN</div>
                <div class="sub-title">EST 2026</div>
                <p class="desc">
                    很棒的戰對。適合給想要考戰對可是又找不到好的戰對的Rivals玩家。每個成員都品行優良。
                </p>
                <div class="difficulty-box ty-box">考核難度：比較簡單</div>
                <div class="ty-malware-container">
                    <div class="ty-warning-text-huge">
                        此戰對遭到惡意人士破壞<br>目前停用中
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        const cursorBlur = document.getElementById('custom-cursor-blur');
        const vnSide = document.getElementById('vnSide');
        const tySide = document.getElementById('tySide');
        const middleGap = document.getElementById('middleGap');
        const mainContainer = document.getElementById('mainContainer');
        const flashOverlay = document.getElementById('impact-flash');
        const vnCanvas = document.getElementById('vnCanvas');
        const tyCanvas = document.getElementById('tyCanvas');
        const vnBtn = document.getElementById('vnBtn');
        const audioToggle = document.getElementById('audioToggle');
        const fpsVal = document.getElementById('fpsVal');
        const pingVal = document.getElementById('pingVal');
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX;
        let cursorY = mouseY;
        let currentHash = '';

        let vnBtnMag = { cx: 0, cy: 0, tx: 0, ty: 0 };

        const vnCtx = vnCanvas.getContext('2d');
        const tyCtx = tyCanvas.getContext('2d');
        let vnParticles = [];
        let tyParticles = [];

        let audioCtx = null;
        let audioMuted = false;

        let lastFrameTime = performance.now();
        let frameCount = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthSound(type) {
            if (audioMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.06);
                    gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.06);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
                    gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                } else if (type === 'switch') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.25);
                    gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch (e) {}
        }

        audioToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            audioMuted = !audioMuted;
            if (audioMuted) {
                audioToggle.classList.remove('audio-on');
                audioToggle.innerText = 'AUDIO: OFF';
            } else {
                audioToggle.classList.add('audio-on');
                audioToggle.innerText = 'AUDIO: ON';
                playSynthSound('hover');
            }
        });

        function resizeCanvases() {
            vnCanvas.width = vnSide.offsetWidth;
            vnCanvas.height = vnSide.offsetHeight;
            tyCanvas.width = tySide.offsetWidth;
            tyCanvas.height = tySide.offsetHeight;
        }

        function createParticle(sideType) {
            const w = sideType === 'vn' ? vnCanvas.width : tyCanvas.width;
            const h = sideType === 'vn' ? vnCanvas.height : tyCanvas.height;
            return {
                x: Math.random() * w,
                y: h + Math.random() * 30,
                vx: (Math.random() - 0.5) * 0.4,
                vy: sideType === 'vn' ? -(Math.random() * 0.8 + 0.4) : -(Math.random() * 0.4 + 0.15),
                size: sideType === 'vn' ? Math.random() * 5 + 2 : Math.random() * 4 + 1.5,
                opacity: sideType === 'vn' ? Math.random() * 0.4 + 0.15 : Math.random() * 0.15 + 0.05,
                maxLife: Math.random() * 300 + 200,
                life: 0
            };
        }

        function spawnBurst(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const el = document.createElement('div');
                el.className = 'click-burst-p';
                const size = Math.random() * 6 + 4;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = color;
                el.style.boxShadow = `0 0 10px ${color}`;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 120 + 60;
                const dx = Math.cos(angle) * speed + 'px';
                const dy = Math.sin(angle) * speed + 'px';
                
                el.style.setProperty('--dx', dx);
                el.style.setProperty('--dy', dy);
                
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 500);
            }
        }

        function updateParticles(ctx, list, count, sideType, colorStr) {
            if (list.length < count && Math.random() < 0.4) {
                list.push(createParticle(sideType));
            }
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            for (let i = list.length - 1; i >= 0; i--) {
                const p = list[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life++;
                
                let currentOpacity = p.opacity * (1 - (p.life / p.maxLife));
                if (currentOpacity < 0) currentOpacity = 0;
                
                ctx.fillStyle = colorStr.replace('ALPHA', currentOpacity.toFixed(3));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.y < -20 || p.life >= p.maxLife) {
                    list.splice(i, 1);
                }
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            const vnRect = vnSide.getBoundingClientRect();
            const tyRect = tySide.getBoundingClientRect();

            if (mouseX >= vnRect.left && mouseX <= vnRect.right && mouseY >= vnRect.top && mouseY <= vnRect.bottom) {
                if (currentHash !== 'vn') {
                    currentHash = 'vn';
                    playSynthSound('hover');
                }
                const localX = mouseX - vnRect.left;
                const localY = mouseY - vnRect.top;
                vnSide.style.setProperty('--x', localX + 'px');
                vnSide.style.setProperty('--y', localY + 'px');
                vnSide.style.setProperty('--bg-x', ((localX / vnRect.width) - 0.5) * -15 + 'px');
                vnSide.style.setProperty('--bg-y', ((localY / vnRect.height) - 0.5) * -15 + 'px');
                
                const card = vnSide.querySelector('.card');
                const cx = (localX / vnRect.width - 0.5) * 20;
                const cy = (localY / vnRect.height - 0.5) * -20;
                card.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;
                card.style.setProperty('--gloss-x', (localX / vnRect.width) * 100 + '%');
                card.style.setProperty('--gloss-y', (localY / vnRect.height) * 100 + '%');
            } else {
                vnSide.querySelector('.card').style.transform = 'rotateY(0deg) rotateX(0deg)';
            }

            if (mouseX >= tyRect.left && mouseX <= tyRect.right && mouseY >= tyRect.top && mouseY <= tyRect.bottom) {
                if (currentHash !== 'ty') {
                    currentHash = 'ty';
                    playSynthSound('hover');
                }
                const localX = mouseX - tyRect.left;
                const localY = mouseY - tyRect.top;
                tySide.style.setProperty('--x', localX + 'px');
                tySide.style.setProperty('--y', localY + 'px');
                tySide.style.setProperty('--bg-x', ((localX / tyRect.width) - 0.5) * -8 + 'px');
                tySide.style.setProperty('--bg-y', ((localY / tyRect.height) - 0.5) * -8 + 'px');
                
                const card = tySide.querySelector('.card');
                const cx = (localX / tyRect.width - 0.5) * 8;
                const cy = (localY / tyRect.height - 0.5) * -8;
                card.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;
                card.style.setProperty('--gloss-x', (localX / tyRect.width) * 100 + '%');
                card.style.setProperty('--gloss-y', (localY / tyRect.height) * 100 + '%');
            } else {
                tySide.querySelector('.card').style.transform = 'rotateY(0deg) rotateX(0deg)';
            }

            if (mouseX >= middleGap.getBoundingClientRect().left && mouseX <= middleGap.getBoundingClientRect().right) {
                if (currentHash !== 'gap') {
                    currentHash = 'gap';
                    playSynthSound('switch');
                }
            }

            const vnBtnRect = vnBtn.getBoundingClientRect();
            if (mouseX >= vnBtnRect.left && mouseX <= vnBtnRect.right && mouseY >= vnBtnRect.top && mouseY <= vnBtnRect.bottom) {
                vnBtnMag.tx = (mouseX - (vnBtnRect.left + vnBtnRect.width / 2)) * 0.35;
                vnBtnMag.ty = (mouseY - (vnBtnRect.top + vnBtnRect.height / 2)) * 0.35;
            } else {
                vnBtnMag.tx = 0;
                vnBtnMag.ty = 0;
            }
        });

        window.addEventListener('mousedown', () => {
            document.body.classList.add('cursor-clicking');
            playSynthSound('click');

            mainContainer.classList.add('shake');
            setTimeout(() => mainContainer.classList.remove('shake'), 350);

            if (currentHash === 'vn') {
                spawnBurst(mouseX, mouseY, '#00f2fe');
                flashOverlay.className = 'flash-vn';
                setTimeout(() => flashOverlay.className = '', 450);
            } else if (currentHash === 'ty') {
                spawnBurst(mouseX, mouseY, '#ff3b30');
                flashOverlay.className = 'flash-ty';
                mainContainer.classList.add('terminal-glitch');
                setTimeout(() => {
                    flashOverlay.className = '';
                    mainContainer.classList.remove('terminal-glitch');
                }, 450);
            }
        });

        window.addEventListener('mouseup', () => {
            document.body.classList.remove('cursor-clicking');
        });

        function loop() {
            cursorX += (mouseX - cursorX) * 0.22;
            cursorY += (mouseY - cursorY) * 0.22;
            cursor.style.transform = `translate(-50%, -50%) translate3d(${mouseX}px, ${mouseY}px, 0)`;
            cursorBlur.style.transform = `translate(-50%, -50%) translate3d(${cursorX}px, ${cursorY}px, 0)`;

            vnBtnMag.cx += (vnBtnMag.tx - vnBtnMag.cx) * 0.15;
            vnBtnMag.cy += (vnBtnMag.ty - vnBtnMag.cy) * 0.15;
            vnBtn.style.setProperty('--mag-x', vnBtnMag.cx + 'px');
            vnBtn.style.setProperty('--mag-y', vnBtnMag.cy + 'px');

            updateParticles(vnCtx, vnParticles, 65, 'vn', 'rgba(0, 242, 254, ALPHA)');
            updateParticles(tyCtx, tyParticles, 25, 'ty', 'rgba(255, 59, 48, ALPHA)');

            frameCount++;
            const now = performance.now();
            if (now >= lastFrameTime + 1000) {
                fpsVal.innerText = Math.round((frameCount * 1000) / (now - lastFrameTime));
                frameCount = 0;
                lastFrameTime = now;
                pingVal.innerText = Math.floor(Math.random() * 12 + 18);
            }

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();
        loop();
    </script>
</body>
</html>
